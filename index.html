:root {
  --paper: #F1F2F2; --paper-2: #E2E4E4; --ink: #111111; --ink-2: #474744; --ink-3: #66665F;
  --red: #E1251B; --red-text: #B81A12; --on-red: #FFFFFF;
  --blk: #111111; --on-blk: #F3F3EF; --on-blk-2: #B9B9B3; --red-on-blk: #FF5246;
  --hatch: rgba(17,17,17,.28); --now-fill: rgba(225,37,27,.34);
  --tabbar: 62px; --rail: 50px;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --text: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #121212; --paper-2: #232321; --ink: #EDEDE8; --ink-2: #B6B6B0; --ink-3: #7E7E78;
  --red: #E1251B; --red-text: #FF6157; --on-red: #FFFFFF;
  --blk: #EDEDE8; --on-blk: #121212; --on-blk-2: #4E4E4A; --red-on-blk: #B81A12;
  --hatch: rgba(237,237,232,.26); --now-fill: rgba(225,37,27,.22);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 15px/1.4 var(--text); font-variant-numeric: tabular-nums; overscroll-behavior-y: none; min-height: 100vh; caret-color: var(--red); }
::selection { background: var(--red); color: var(--on-red); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; flex: none; }
.muted { color: var(--ink-2); }
.hide { display: none !important; }
* { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

/* ---------- шапка ---------- */
.mast { background: var(--red); color: var(--on-red); height: 52px; padding: 0 max(16px, calc((100% - 528px) / 2)); display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.mast .rule { width: 44px; height: 5px; background: #111; transform: rotate(-24deg); flex: none; }
.word { font: 900 22px/1 var(--display); letter-spacing: .04em; }
.mast .grp { margin-left: auto; font: 700 12px/1 var(--display); letter-spacing: .04em; background: #111; color: #F3F3EF; padding: 7px 9px; position: relative; z-index: 1; }

main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom)); }
.view { display: none; }
.view.on { display: block; }

/* ---------- навигация ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--ink-3); position: relative;
  font: 700 11px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.tab svg.i { width: 22px; height: 22px; }
.tab.on { color: var(--ink); }
.tab.on::before { content: ""; position: absolute; top: -2px; left: 22%; right: 22%; height: 5px; background: var(--red); }

/* ---------- общие ---------- */
.h2 { font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 30px 0 4px; padding-top: 10px; border-top: 3px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.h2 small { font: 500 12px var(--text); text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; background: var(--red); color: var(--on-red);
  font: 700 13px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; transition: transform .1s; flex: none; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 11px; }
.btn.block { width: 100%; flex: 1; }
.btn:disabled { opacity: .4; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); flex: none; }
.input { width: 100%; height: 50px; border: 0; box-shadow: inset 0 0 0 2px var(--ink); background: transparent; padding: 0 14px; outline: none; border-radius: 0; font-size: 16px; }
.input:focus { box-shadow: inset 0 0 0 3px var(--red); }
.input::placeholder { color: var(--ink-3); }
.grow { flex: 1; min-width: 0; }
.tiny { font-size: 12.5px; }
.skel { height: 88px; background: var(--paper-2); margin-top: 10px; animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--paper);
  padding: 12px 14px; font-weight: 600; font-size: 14px; transform: translateY(14px); opacity: 0; transition: .2s cubic-bezier(.16,1,.3,1); pointer-events: none; z-index: 60; }
.toast.on { opacity: 1; transform: none; }

/* ---------- день ---------- */
.dayhead { display: flex; align-items: center; gap: 10px; padding: 16px 0 14px; }
.dayhead .t { flex: 1; min-width: 0; }
.dayhead .t b { display: block; font: 800 16px/1.15 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.dayhead .t span { font-size: 13px; color: var(--ink-2); }
.leave { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: end; padding: 2px 0 14px; border-bottom: 3px solid var(--ink); }
.leave .big { font: 900 58px/.84 var(--display); letter-spacing: -.03em; grid-row: span 2; }
.leave .lbl { font: 800 13px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.leave .lbl.red { color: var(--red-text); }
.leave .sub { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.leave.past .big { color: var(--ink-3); }
.leave.compact { display: block; padding: 0 0 12px; }
.wx { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--ink); font-size: 14px; }
.wx svg.i { width: 26px; height: 26px; }
.wx b { font: 800 18px/1 var(--display); }
.wx .tip { color: var(--red-text); font-weight: 600; }
.next { margin-top: 12px; background: var(--blk); color: var(--on-blk); padding: 11px 14px; display: flex; align-items: center; gap: 12px; }
.next .k { font: 800 11px/1 var(--display); letter-spacing: .06em; color: var(--red-on-blk); text-transform: uppercase; }
.next .v { font: 800 17px/1.15 var(--display); text-transform: uppercase; margin-top: 4px; }
.next .s { font-size: 12.5px; color: var(--on-blk-2); margin-top: 3px; }
.next .eta { text-align: right; font: 900 26px/1 var(--display); }
.next .x { font: 600 12.5px/1.3 var(--text); color: var(--red-on-blk); margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.next .eta small { display: block; font: 700 11px/1.2 var(--display); letter-spacing: .05em; color: var(--on-blk-2); text-transform: uppercase; margin-top: 3px; }

.axis { position: relative; margin-top: 20px; }
.axis .rail { position: absolute; left: calc(var(--rail) - 1px); top: 0; bottom: 0; width: 4px; background: var(--ink); }
.tick { position: absolute; left: 0; width: var(--rail); height: 0; }
.tick span { position: absolute; top: -7px; left: 0; font: 600 11px/14px var(--display); color: var(--ink-3); }
.tick::after { content: ""; position: absolute; left: calc(var(--rail) - 6px); width: 8px; height: 2px; background: var(--ink); top: -1px; }
.mk { position: absolute; left: 0; right: 0; height: 0; z-index: 2; }
.mk b { position: absolute; top: -8px; left: 0; font: 800 11px/16px var(--display); background: var(--paper); padding-right: 4px; }
.mk span { position: absolute; top: -8px; left: calc(var(--rail) + 12px); font: 700 11px/16px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.mk::after { content: ""; position: absolute; left: calc(var(--rail) - 5px); top: -6px; width: 12px; height: 12px; background: var(--paper); box-shadow: inset 0 0 0 3px var(--ink); }
.blk { position: absolute; left: calc(var(--rail) + 12px); right: 0; background: var(--blk); color: var(--on-blk); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px; text-align: left; }
.blk .bt { display: flex; align-items: baseline; gap: 8px; font: 700 11px/14px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--on-blk-2); }
.blk .bt .kd { margin-left: auto; white-space: nowrap; }
.blk .bt .kd.hot { color: var(--red-on-blk); }
.blk .bt .live { color: var(--red-on-blk); }
.blk .bn { font: 700 15px/1.22 var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blk .bm { font-size: 12.5px; color: var(--on-blk-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bm b { color: var(--on-blk); font: 800 12.5px var(--display); letter-spacing: .02em; }
.blk.past { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--ink-3); }
.blk.past .bt, .blk.past .bm { color: var(--ink-3); }
.blk.past .bt .kd.hot { color: var(--red-text); }
.blk.past .bm b { color: var(--ink-2); }
.blk.now .bt { background: var(--blk); margin: -8px -12px 0; padding: 8px 12px 3px; }
.blk.now { box-shadow: 0 0 0 3px var(--red); background-image: linear-gradient(to bottom, var(--now-fill) var(--p, 0%), transparent var(--p, 0%)); }
.blk.par { background: transparent; color: var(--ink); outline: 2px dashed var(--ink); outline-offset: -2px; }
.blk.par .bt, .blk.par .bm { color: var(--ink-2); }
.gapz { position: absolute; left: calc(var(--rail) + 12px); right: 0; display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 8px); }
.gapz span { background: var(--paper); padding: 3px 8px; font: 700 11px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.gapz.warn span { color: var(--red-text); }
.now-line { position: absolute; left: 0; right: 0; height: 0; z-index: 3; pointer-events: none; animation: wedge .9s cubic-bezier(.16,1,.3,1) both; }
.now-line::before { content: ""; position: absolute; left: calc(var(--rail) + 3px); width: 9px; top: -1px; height: 2px; background: var(--red); }
.now-line.still { animation: none; }
.now-line i { position: absolute; left: calc(var(--rail) - 12px); top: -11px; width: 24px; height: 22px; background: var(--red); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.now-line b { position: absolute; left: 0; top: -9px; font: 900 11px/18px var(--display); color: var(--on-red); background: var(--red); padding: 0 3px; }
@keyframes wedge { from { transform: translateY(var(--from, 0px)); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .now-line { animation: none; } }

.empty { padding: 26px 0 8px; position: relative; min-height: 260px; }
.empty .big { font: 900 clamp(40px, 13vw, 60px)/.9 var(--display); overflow-wrap: anywhere; letter-spacing: -.03em; text-transform: uppercase; position: relative; z-index: 1; }
.empty .disc { position: absolute; right: 0; top: 10px; width: 128px; height: 128px; border-radius: 50%; background: var(--red); }
.empty .bar { position: absolute; right: 30px; top: 128px; width: 160px; height: 10px; background: var(--ink); transform: rotate(-28deg); }
.empty img.mascot { position: absolute; right: -4px; top: -4px; width: 150px; height: 150px; object-fit: contain; z-index: 2; }
.empty p { margin: 74px 0 0; max-width: 30ch; color: var(--ink-2); position: relative; z-index: 1; }

.chk { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--ink); width: 100%; }
.chk .box { width: 24px; height: 24px; box-shadow: inset 0 0 0 2px var(--ink); display: grid; place-items: center; flex: none; }
.chk .box svg.i { width: 16px; height: 16px; stroke-width: 3; opacity: 0; }
.chk.done .box { background: var(--red); box-shadow: none; color: var(--on-red); }
.chk.done .box svg.i { opacity: 1; }
.chk.done .t { text-decoration: line-through; color: var(--ink-3); }
.chk .t { font-weight: 600; }
.chk .d { font-size: 12.5px; color: var(--ink-2); }
.chg { padding: 12px 0; border-bottom: 1px solid var(--ink); display: grid; grid-template-columns: 78px 1fr; gap: 2px 12px; }
.chg .w { font: 800 11px/1.25 var(--display); text-transform: uppercase; letter-spacing: .04em; grid-row: span 2; }
.chg.removed .w, .chg.changed .w { color: var(--red-text); }
.chg .n { font-weight: 700; }
.chg .x { font-size: 13px; color: var(--ink-2); }
.chg .x b { color: var(--ink); font: 800 13px var(--display); }
.chg .x s { text-decoration-thickness: 2px; text-decoration-color: var(--red); }
.note { font-size: 13.5px; color: var(--ink-2); padding: 10px 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; }

/* ---------- неделя ---------- */
.wkhead { display: flex; align-items: center; gap: 10px; padding: 16px 0 12px; }
.wkhead b { flex: 1; text-align: center; font: 800 15px/1.2 var(--display); text-transform: uppercase; }
.wk { display: grid; grid-template-columns: 26px repeat(var(--cols), minmax(0, 1fr)); gap: 0 4px; }
.wk .dh { text-align: center; padding: 6px 0 8px; font: 800 11px/1.2 var(--display); text-transform: uppercase; border-bottom: 3px solid var(--ink); cursor: pointer; }
.wk .dh span { display: block; font-size: 17px; margin-top: 2px; }
.wk .dh.today { color: var(--red-text); border-color: var(--red); }
.wk .col { position: relative; cursor: pointer; }
.wk .rl { position: relative; }
.wk .rl span { position: absolute; left: 0; top: -7px; font: 600 11px/14px var(--display); color: var(--ink-3); }
.wb { position: absolute; left: 0; right: 0; background: var(--blk); color: var(--on-blk); padding: 5px 4px; overflow: hidden; }
.wb b { display: block; font: 800 13px/1.1 var(--text); overflow: hidden; white-space: nowrap; }
.wb span { display: block; font: 600 11px/1.25 var(--display); color: var(--on-blk-2); margin-top: 3px; }
.wb.past { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-3); color: var(--ink-2); }
.wb.past span { color: var(--ink-3); }
.wb.par { background: transparent; outline: 2px dashed var(--ink); outline-offset: -2px; color: var(--ink); }
.wb.par span { color: var(--ink-2); }
.wb.hot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--red); }
.wkline { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px solid var(--red); z-index: 2; }
.foot { font-size: 12px; color: var(--ink-3); margin: 26px 0 6px; }

/* ---------- поиск ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 16px 0 12px; box-shadow: inset 0 0 0 2px var(--ink); }
.seg button { height: 44px; font: 700 12px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); text-align: center; }
.seg button.on { background: var(--ink); color: var(--paper); }
.res { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 0; border-bottom: 1px solid var(--ink); }
.res .av { width: 40px; height: 40px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 900 15px var(--display); flex: none; }
.res b { display: block; font-weight: 700; }
.lrow { display: grid; grid-template-columns: 62px 1fr; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--ink); }
.lrow .tm { font: 800 13px/1.25 var(--display); grid-row: span 3; }
.lrow .tm span { display: block; font-weight: 600; color: var(--ink-3); }
.lrow .n { font-weight: 700; }
.lrow .m { font-size: 13px; color: var(--ink-2); }
.pair { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ink); align-items: center; }
.pair .tm { font: 800 12.5px var(--display); }
.pair .free { font: 800 12px var(--display); text-transform: uppercase; letter-spacing: .05em; display: inline-flex; align-items: center; gap: 6px; }
.pair .busy { background: var(--blk); color: var(--on-blk); padding: 8px 10px; }
.pair .busy + .busy { margin-top: 4px; }
.pair .busy b { display: block; font-size: 14px; }
.pair .busy span { font-size: 12px; color: var(--on-blk-2); }
.dates { display: flex; gap: 6px; overflow-x: auto; margin: 4px 0 8px; }
.dates button { flex: none; height: 34px; padding: 0 12px; box-shadow: inset 0 0 0 2px var(--ink); font: 700 11px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.dates button.on { background: var(--ink); color: var(--paper); }
.spin { width: 26px; height: 26px; margin: 30px auto; background: var(--red); animation: spin 1s steps(4) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- я ---------- */
.set { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--ink); min-height: 60px; }
.set .l { flex: 1; min-width: 0; }
.set .l b { display: block; font-weight: 600; }
.set .l span { font-size: 12.5px; color: var(--ink-2); }
.step { display: flex; align-items: stretch; box-shadow: inset 0 0 0 2px var(--ink); flex: none; height: 44px; }
.step button { width: 44px; display: grid; place-items: center; }
.step button svg.i { width: 16px; height: 16px; stroke-width: 2.5; }
.step output { min-width: 64px; display: grid; place-items: center; font: 800 12px var(--display); box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); }
.sw { width: 52px; height: 30px; box-shadow: inset 0 0 0 2px var(--ink); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 5px; left: 5px; width: 20px; height: 20px; background: var(--ink); transition: transform .18s cubic-bezier(.16,1,.3,1); }
.sw.on { background: var(--ink); }
.sw.on::after { transform: translateX(22px); background: var(--red); }
.disc { padding: 12px 0; border-bottom: 1px solid var(--ink); }
.disc .n { font-weight: 700; }
.items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.item { display: inline-flex; align-items: center; gap: 0; background: var(--ink); color: var(--paper); padding: 0 0 0 12px; min-height: 44px; font-weight: 600; font-size: 13.5px; }
.item button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--paper); }
.item svg.i { width: 12px; height: 12px; stroke-width: 3; }
.add { display: flex; gap: 6px; margin-top: 8px; }
.add .input { height: 40px; font-size: 14px; }
.add .btn { height: 40px; width: 44px; padding: 0; }

/* ---------- шторка ---------- */
.scrim { position: fixed; inset: 0; background: rgba(17,17,17,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--paper); border-top: 6px solid var(--red); padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height: 86vh; overflow-y: auto; transform: translateY(105%); transition: transform .26s cubic-bezier(.16,1,.3,1); max-width: 560px; margin: 0 auto; }
.sheet.on { transform: none; }
.sheet h4 { margin: 0 0 4px; font: 800 17px/1.2 var(--display); text-transform: uppercase; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; font-size: 14px; margin: 14px 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 600; }
.act { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border-top: 1px solid var(--ink); font-weight: 600; text-decoration: none; }
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--ink); }
.opt b { display: block; }

/* ---------- онбординг ---------- */
.onb { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto; display: none; }
.onb.on { display: block; }
.onb .body { max-width: 560px; margin: 0 auto; padding: 22px 16px calc(110px + env(safe-area-inset-bottom)); }
.onb h1 { font: 900 34px/1 var(--display); text-transform: uppercase; letter-spacing: -.02em; margin: 12px 0 10px; }
.onb p.lead { margin: 0 0 18px; color: var(--ink-2); max-width: 36ch; }
.onb .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 2px solid var(--ink); }
.onb .cta > div { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.gres { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.gres button { height: 40px; padding: 0 14px; box-shadow: inset 0 0 0 2px var(--ink); font: 800 13px var(--display); }
.gres button.on { background: var(--red); color: var(--on-red); box-shadow: none; }

/* ================= «Пара» Б 2.0: палитра стикеров, красная шапка, Ильич ================= */
@font-face { font-family: "Geologica"; src: url(static/fonts/geologica-cyrillic.woff2) format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Geologica"; src: url(static/fonts/geologica-latin.woff2) format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2212; }
@font-face { font-family: "Golos"; src: url(static/fonts/golos-text-cyrillic.woff2) format("woff2"); font-weight: 400 900; font-display: swap; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Golos"; src: url(static/fonts/golos-text-latin.woff2) format("woff2"); font-weight: 400 900; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2212; }
@font-face { font-family: "Dela"; src: url(static/fonts/dela-gothic-one-cyrillic.woff2) format("woff2"); font-display: block; unicode-range: U+0400-045F; }
@font-face { font-family: "Dela"; src: url(static/fonts/dela-gothic-one-latin.woff2) format("woff2"); font-display: block; unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
:root {
  --paper: #FFF5EE; --paper-2: #FBE8DC; --card: #FFFFFF; --ink: #2C2018; --ink-2: #735C56; --ink-3: #9A817A;
  --red: #DA2227; --red-2: #B81B20; --red-dk: #8E1516; --red-text: #B81A1F; --on-red: #FFFFFF;
  --blk: #4D3D36; --on-blk: #F0F8FA; --on-blk-2: #E3C7B6; --red-on-blk: #FFB3A8;
  --skin: #FCCAA7; --skin-sh: #D99775; --hair: rgba(44,32,24,.1); --hatch: rgba(115,92,86,.22); --now-fill: rgba(218,34,39,.16);
  --shadow: 0 1px 0 rgba(44,32,24,.04), 0 12px 30px -14px rgba(142,21,22,.35); --bar: rgba(255,255,255,.88);
  --display: "Geologica", "Golos", system-ui, sans-serif; --text: "Golos", system-ui, -apple-system, sans-serif; --num: "Dela", "Geologica", sans-serif;
  --tabbar: 64px;
}
:root[data-theme="dark"] {
  --paper: #1C1210; --paper-2: #2C2018; --card: #2C2018; --ink: #F0F8FA; --ink-2: #D9B8A4; --ink-3: #A88E82; --red-text: #FF8A80;
  --blk: #735C56; --on-blk: #FFFFFF; --on-blk-2: #F6DCCB; --red-on-blk: #FFD0C8;
  --hair: rgba(240,248,250,.1); --hatch: rgba(240,248,250,.14); --shadow: 0 14px 34px -14px rgba(0,0,0,.75); --bar: rgba(44,32,24,.9);
}
body { font-family: var(--text); font-weight: 500; -webkit-font-smoothing: antialiased; }
svg.i { stroke-linecap: round; stroke-linejoin: round; --icf: #FCCAA7; }
symbol .f { fill: var(--icf, #FCCAA7); }
.tab.on svg.i, .panel svg.i, .btn:not(.ghost) svg.i, .pn-g svg.i { --icf: rgba(255,255,255,.3); }
:root[data-theme="dark"] svg.i { --icf: rgba(255,255,255,.12); }
main { padding-bottom: calc(var(--tabbar) + 40px + env(safe-area-inset-bottom)); }

.mast { min-height: 60px; height: auto; border-radius: 0 0 28px 28px; }
.mast .rule { display: none; }
.word { font: 800 26px/1 var(--display); letter-spacing: -.03em; display: inline-flex; align-items: center; gap: 6px; }
.word::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--skin); transform: translateY(-8px); }
.mast .grp { background: rgba(255,255,255,.16); color: #fff; border-radius: 22px; height: 40px; padding: 0 5px 0 14px; display: flex; align-items: center; gap: 8px; font: 700 13px var(--text); letter-spacing: 0; }
.mast .grp img { width: 30px; height: 30px; border-radius: 50%; background: var(--skin); object-fit: cover; object-position: 50% 10%; }
body.hero-on .mast { border-radius: 0; }

.tabbar { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); border: 0; border-radius: 30px; background: var(--bar); padding: 6px;
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 12px 34px -10px rgba(44,32,24,.4), 0 0 0 1px var(--hair); max-width: 536px; margin: 0 auto; }
.tabbar nav { height: auto; gap: 2px; grid-template-columns: repeat(5, 1fr); }
.tab { min-height: 52px; border-radius: 24px; font: 700 10.5px var(--text); letter-spacing: 0; text-transform: none; color: var(--ink-2); gap: 3px; }
.tab.on { background: var(--red); color: #fff; }
.tab.on::before { display: none; }

.h2 { font: 800 22px/1.2 var(--display); text-transform: none; letter-spacing: -.02em; border-top: 0; margin: 28px 2px 10px; padding: 0; }
.h2 small { font: 600 13px var(--text); }
.btn { border-radius: 14px; font: 800 13.5px/1 var(--text); letter-spacing: 0; text-transform: none; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--hair); }
.iconbtn { border-radius: 14px; box-shadow: var(--shadow); background: var(--card); }
.input { border-radius: 14px; box-shadow: inset 0 0 0 2px var(--hair); background: var(--card); }
.input:focus { box-shadow: inset 0 0 0 2px var(--red); }
.skel { border-radius: 22px; }
.toast { border-radius: 18px; background: var(--ink); color: var(--paper); }
.spin { border-radius: 50%; width: 22px; height: 22px; background: none; border: 3px solid var(--hair); border-top-color: var(--red); animation: spin .8s linear infinite; }
.seg { border-radius: 16px; box-shadow: none; background: var(--paper-2); padding: 4px; gap: 4px; }
.seg button { border-radius: 12px; font: 700 13px var(--text); text-transform: none; letter-spacing: 0; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.res, .lrow, .pair, .set, .chk, .disc, .chg { border-bottom-color: var(--hair); }
.opt, .act { border-top-color: var(--hair); }
.res .av { border-radius: 50%; background: var(--paper-2); color: var(--red); font: 400 14px var(--num); }
.lrow .tm, .pair .tm { font: 700 13px/1.25 var(--display); }
.pair .busy { border-radius: 12px; }
.pair .free { font: 700 13px var(--text); text-transform: none; letter-spacing: 0; color: var(--red-text); }
.dates button { border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hair); font: 700 12px var(--text); text-transform: none; }
.dates button.on { background: var(--red); color: #fff; box-shadow: none; }
.step { border-radius: 14px; box-shadow: inset 0 0 0 2px var(--hair); overflow: hidden; }
.step output { box-shadow: inset 2px 0 0 var(--hair), inset -2px 0 0 var(--hair); font: 700 13px var(--text); }
.sw { border-radius: 16px; box-shadow: none; background: var(--paper-2); }
.sw::after { border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw.on { background: var(--red); }
.sw.on::after { background: #fff; }
.item { border-radius: 22px; background: var(--blk); color: var(--on-blk); }
.item button { color: var(--on-blk); }
.chk .box { border-radius: 7px; box-shadow: inset 0 0 0 2px var(--skin-sh); }
.chk.done .box { background: var(--red); }
.sheet { border-top: 0; border-radius: 26px 26px 0 0; background: var(--paper); }
.sheet h4 { font: 800 20px/1.2 var(--display); text-transform: none; }
.dayhead .t b { font: 800 18px/1.2 var(--display); text-transform: none; }
.wkhead b { font: 800 16px/1.2 var(--display); text-transform: none; }
.wk .dh { font: 700 11px/1.2 var(--text); border-bottom: 2px solid var(--hair); }
.wk .dh span { font: 800 18px var(--display); }
.wk .dh.today { color: var(--red); border-color: var(--red); }
.wb { border-radius: 8px; }
.wb.past { box-shadow: inset 0 0 0 2px var(--hair); }
.wb.par { outline-color: var(--ink-3); border-radius: 8px; }
.wb.hot::after { border-radius: 0 0 8px 8px; }
.wb b { font: 700 12.5px/1.1 var(--text); }
.wb span { font: 600 11px/1.25 var(--text); }
.wk .rl span, .tick span { font: 600 11px/14px var(--text); }
.onb h1 { font: 800 34px/1.05 var(--display); text-transform: none; }
.onb .cta { border-top: 1px solid var(--hair); }
.gres button { border-radius: 14px; box-shadow: inset 0 0 0 2px var(--hair); font: 700 14px var(--text); }
.gres button.on { background: var(--red); }
.leave { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); border-bottom: 0; }
.leave .big { font: 400 50px/.9 var(--num); letter-spacing: -.03em; }
.leave .lbl { font: 800 14px/1.15 var(--display); text-transform: none; letter-spacing: 0; }
.empty { text-align: center; padding: 18px 0 6px; min-height: 0; }
.empty .disc, .empty .bar { display: none; }
.empty img.stk { width: 220px; height: auto; display: block; margin: 0 auto 6px; filter: drop-shadow(0 12px 18px rgba(44,32,24,.3)); }
.empty .big { font: 800 44px/1 var(--display); text-transform: none; letter-spacing: -.04em; }
.empty p { margin: 10px auto 0; }
.foot { text-align: center; }

/* --- красная шапка дня --- */
.hero { position: relative; margin: 0 -16px; padding: 2px 16px 26px; color: #fff; border-radius: 0 0 36px 36px; z-index: 2;
  background: linear-gradient(180deg, var(--red) 0%, var(--red) 45%, var(--red-2) 100%); }
.hero.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
.h-date { font: 600 14px var(--text); color: #FFD9CC; }
.h-lbl { font: 800 15px var(--display); text-transform: uppercase; letter-spacing: .06em; color: #FFE5DC; margin-top: 14px; display: flex; align-items: center; gap: 8px; }
.h-lbl .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: hpulse 1.6s infinite; }
@keyframes hpulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
.h-count { display: flex; align-items: flex-end; gap: 8px; margin-top: 4px; height: 116px; }
.h-dig { font: 400 112px/1 var(--num); letter-spacing: -.05em; display: flex; text-shadow: 0 6px 0 rgba(142,21,22,.55); }
.h-dig span { display: inline-block; }
.h-dig.t { font-size: 88px; letter-spacing: -.04em; }
.h-dig.t + .h-unit { display: none; }
.h-dig span.flip { animation: flip .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes flip { 0% { transform: translateY(-55%) rotateX(80deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.h-unit { font: 800 22px var(--display); margin-bottom: 18px; color: #FFE5DC; }
.h-word { font: 400 76px/1 var(--num); letter-spacing: -.04em; text-shadow: 0 6px 0 rgba(142,21,22,.55); }
.h-sub { font: 600 15px/1.35 var(--text); color: #FFE9E2; max-width: 56%; min-height: 40px; }
.h-track { margin-top: 14px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden; width: 52%; }
.h-track i { display: block; height: 100%; background: #fff; border-radius: 4px; transition: width .6s cubic-bezier(.2,.9,.3,1); }
.ily { position: absolute; right: 0; bottom: -88px; width: 156px; height: 156px; z-index: 5; touch-action: manipulation; }
.ily .body { display: block; width: 100%; height: 100%; transform-origin: 50% 90%; animation: breathe 3.2s ease-in-out infinite; }
.ily img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 14px 18px rgba(44,32,24,.35)); }
.ily img.pop, .bub.pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes breathe { 0%, 100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.035); } }
@keyframes pop { 0% { transform: scale(.4) rotate(-10deg); opacity: .2; } 60% { transform: scale(1.1) rotate(3deg); } 100% { transform: none; opacity: 1; } }
.ily.jump .body { animation: jump .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes jump { 0% { transform: none; } 20% { transform: scale(1.15,.82); } 50% { transform: translateY(-34px) scale(.92,1.1); } 100% { transform: none; } }
.bub { position: relative; margin: 14px 150px 0 0; background: var(--card); color: var(--ink); border-radius: 22px 22px 6px 22px; padding: 12px 14px;
  font: 700 14px/1.3 var(--text); box-shadow: 0 14px 30px -12px rgba(44,32,24,.45); transform-origin: 100% 100%; }
.bub small { display: block; font: 800 11px var(--text); color: var(--red-text); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }

/* --- плитки --- */
.tiles { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-top: 22px; }
.tile { position: relative; background: var(--card); border-radius: 26px; padding: 16px; box-shadow: var(--shadow); min-height: 150px; display: flex; flex-direction: column; align-items: stretch; text-align: left; width: 100%; }
.anim .tile { opacity: 0; transform: translateY(40px) scale(.94); animation: fly .7s cubic-bezier(.2,1.3,.4,1) forwards; }
.anim .tile:nth-child(2) { animation-delay: .07s; } .anim .tile:nth-child(3) { animation-delay: .14s; } .anim .tile:nth-child(4) { animation-delay: .21s; }
@keyframes fly { to { opacity: 1; transform: none; } }
.tile.full { grid-column: 1 / -1; min-height: 0; }
.t-lbl { font: 800 11.5px var(--text); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.t-big { font: 400 34px/1 var(--num); letter-spacing: -.03em; margin-top: auto; padding-top: 12px; }
.t-big small { font: 800 16px var(--display); letter-spacing: 0; margin-left: 4px; }
.t-sub { font: 600 13px/1.3 var(--text); color: var(--ink-2); margin-top: 5px; }
.t-btn { margin-top: 12px; min-height: 40px; border-radius: 14px; font: 800 13px var(--text); display: flex; align-items: center; justify-content: center; background: #fff; color: var(--red); }
.peek { position: absolute; width: 72px; right: -10px; top: -28px; transform: rotate(8deg); filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); pointer-events: none; }
.ticket { background: radial-gradient(circle at 0 calc(100% - 50px), transparent 12px, var(--card) 12.5px) left/51% 100% no-repeat,
  radial-gradient(circle at 100% calc(100% - 50px), transparent 12px, var(--card) 12.5px) right/51% 100% no-repeat; box-shadow: none; filter: drop-shadow(0 10px 16px rgba(142,21,22,.18)); }
:root[data-theme="dark"] .ticket { filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.ticket .perf { position: absolute; left: 18px; right: 18px; bottom: 50px; border-top: 2px dashed var(--hair); }
.t-rm { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-top: 24px; min-width: 0; }
.t-rm b { font: 400 22px var(--num); white-space: nowrap; }
.t-rm span { font: 700 11.5px var(--text); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ses { background: linear-gradient(160deg, #EC3134, var(--red) 50%, var(--red-dk)); color: #fff; }
.ses .t-lbl, .ses .t-sub { color: #FFE3DA; }
.ses .t-big { font-size: 40px; }
.wxt .i { position: absolute; right: 14px; top: 12px; width: 34px; height: 34px; color: var(--skin-sh); }
.wxt .t-big { font-size: 44px; }
.tile .chk { padding: 8px 0; border-bottom: 1px solid var(--hair); }
.tile .chk:last-child { border-bottom: 0; }
.tile.skel-t .t-big { animation: pulse 1.2s ease-in-out infinite alternate; opacity: .35; }

/* --- лента дня --- */
.plist { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 6px 0; overflow: hidden; }
.pl { position: relative; display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 12px; padding: 14px 18px 14px 20px; align-items: center; width: 100%; text-align: left; }
.pl + .pl, .plg + .pl { border-top: 1px solid var(--hair); }
.pl .tm { font: 700 15px/1.15 var(--display); grid-row: 1 / 3; }
.pl .tm small { display: block; font: 500 12px var(--text); color: var(--ink-2); margin-top: 2px; }
.pl .nm { font: 700 15px/1.25 var(--text); }
.pl .pp { font: 500 13px/1.3 var(--text); color: var(--ink-2); grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .rm { grid-row: 1 / 3; grid-column: 3; text-align: right; font: 400 20px/1 var(--num); }
.pl.past > * { opacity: .42; }
.pl.now { background: var(--paper-2); }
.pl.now::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--red); }
.pl.now .rm { color: var(--red); }
.pl.par .rm { color: var(--ink-3); }
.pill { display: inline-block; font: 800 10.5px/1 var(--text); padding: 4px 7px; border-radius: 7px; background: var(--paper-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; text-transform: lowercase; }
.pl.now .pill { background: var(--red); color: #fff; }
.pill.red { background: rgba(218,34,39,.13); color: var(--red-text); }
.plg { display: flex; align-items: center; gap: 10px; margin: 0 14px; padding: 8px 10px; border-radius: 16px; background: var(--paper); font: 600 13px var(--text); color: var(--ink-2); }
.plg img { width: 40px; height: 40px; object-fit: contain; margin: -4px 0; }
.plg b { color: var(--ink); }
.plg.now { background: rgba(218,34,39,.1); color: var(--red-text); }
.pl-end { display: flex; justify-content: space-between; padding: 14px 20px 10px; border-top: 1px solid var(--hair); font: 600 13px var(--text); color: var(--ink-2); }
.pl-end b { color: var(--ink); }
.dnav { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
.exr { display: grid; grid-template-columns: 64px 1fr; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--hair); }
.exr .d { font: 400 22px/1 var(--num); grid-row: span 2; }
.exr .d small { display: block; font: 700 11px var(--text); color: var(--ink-2); margin-top: 4px; }
.exr b { font-weight: 700; }
.exr span { font-size: 13px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .ily .body, .h-lbl .dot { animation: none; } .anim .tile { animation: none; opacity: 1; transform: none; } }

/* --- свободные аудитории, календарь, новости --- */
.seg3 { grid-template-columns: repeat(3, 1fr); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; }
.chips button { flex: none; height: 38px; padding: 0 13px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--hair); font: 700 13px var(--text); color: var(--ink); }
.chips button.on { background: var(--red); color: #fff; box-shadow: none; }
.chips.pairs button { display: flex; gap: 6px; align-items: center; }
.chips.pairs b { font: 400 13px var(--num); color: var(--red-text); }
.chips.pairs .on b { color: #FFE1D6; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.room { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.room b { font: 400 17px var(--num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room span { font: 600 12px var(--text); color: var(--ink-2); }

<script>
"use strict";
/* ---------- экран загрузки ---------- */
const BOOT_LINES = ["Тяну расписание с ruz.fa.ru…", "Пересчитываю аудитории…", "Проверяю, не отменили ли пару…", "Ставлю чайник на перемену…", "Учиться, учиться и ещё раз загружаться…", "Верной дорогой идём…"];
let bootI = 0;
const bootT = setInterval(() => { const q = document.getElementById("bootq"); if (!q) return;
  const n = q.cloneNode(false); n.textContent = BOOT_LINES[++bootI % BOOT_LINES.length]; n.className = "in"; q.replaceWith(n); }, 1800);
function bootDone() { const b = document.getElementById("boot"); if (!b || b.classList.contains("off")) return; clearInterval(bootT); b.classList.add("off"); setTimeout(() => b.remove(), 450); }
setTimeout(bootDone, 15000);
const tg = window.Telegram && window.Telegram.WebApp;
const qs = new URLSearchParams(location.search);
const DEV_USER = qs.get("dev_user");
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n) => `<svg class="i"><use href="#${n.startsWith("w-") ? n : "i-" + n}"/></svg>`;
const haptic = (t = "light") => { try { tg?.HapticFeedback?.impactOccurred(t); } catch (e) {} };
const okHaptic = () => { try { tg?.HapticFeedback?.notificationOccurred("success"); } catch (e) {} };
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cap = (s) => s[0].toUpperCase() + s.slice(1);

/* ---------- тема ---------- */
function applyTheme() {
  const forced = qs.get("theme");
  const dark = forced ? forced === "dark" : tg?.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { tg?.setHeaderColor(cssVar("--red")); tg?.setBackgroundColor(cssVar("--paper")); tg?.setBottomBarColor?.(cssVar("--paper")); } catch (e) {}
}

/* ---------- даты и время ---------- */
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const WD_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const WD_ACC = ["воскресенье", "понедельник", "вторник", "среду", "четверг", "пятницу", "субботу"];
const MON_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const pd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return fd(d); };
const monday = (s) => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fd(d); };
const human = (s) => { const d = pd(s); return `${d.getDate()} ${MON_GEN[d.getMonth()]}`; };
const short = (s) => { const d = pd(s); return `${WD[d.getDay()]}, ${d.getDate()} ${MON_GEN[d.getMonth()]}`; };
function relDay(s) {
  const diff = Math.round((pd(s) - pd(S.today)) / 864e5);
  return diff === 0 ? "сегодня" : diff === 1 ? "завтра" : diff === -1 ? "вчера" : WD_FULL[pd(s).getDay()];

async function resolveApi(force = false) {

        <span class="nm">${esc(l.discipline)}<span class="pill ${HOT.has(l.tag) || l.replaces ? "red" : ""}">${st === "now" ? "сейчас" : l.replaces ? "изменение" : esc(l.kind)}</span>${(l.assess || []).map((a) => `<span class="pill as">📝 ${esc(a.label)}</span>`).join("")}</span>
        <span class="rm">${esc(audNo(l.auditorium) || "—")}</span><span class="pp">${esc([l.lecturer, (!i || slots[i - 1].lessons[0].building !== l.building) && bshort(l.building)].filter(Boolean).join(" · ") || " ")}</span>
        ${(l.assess || []).filter((a) => a.note).map((a) => `<span class="pp asn">📝 ${esc(a.note)}</span>`).join("")}</button>`;
    }
    if (s.gap !== undefined) {
      const n = slots[i + 1].lessons[0], on = Date.parse(l.ends) <= now() && now() < Date.parse(n.starts) ? "now" : "";

}

/* ================= ДВИЖЕНИЕ ================= */
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = { out: "cubic-bezier(.22,1,.36,1)", soft: "cubic-bezier(.32,.72,0,1)", spring: "cubic-bezier(.34,1.3,.64,1)" };
const anim = (el, kf, o) => (!el || REDUCE ? null : el.animate(kf, { duration: 320, easing: EASE.out, fill: "both", ...o }));
const hsel = () => { try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {} };
const hnote = (t = "success") => { try { tg?.HapticFeedback?.notificationOccurred(t); } catch (e) {} };

/* выход дня: первое открытие за день — Ильич вбегает и «раскладывает» плитки, дальше — быстро */
function enterScene() {
  if (REDUCE) return;
  let full = false;
  try { full = localStorage.getItem("ily-enter") !== S.today; localStorage.setItem("ily-enter", S.today); } catch (e) {}
  const ily = $("#ily"), tiles = [...document.querySelectorAll("#v-day .tile")], rest = [...document.querySelectorAll("#v-day .h2, #v-day .plist, #v-day .remc, #v-day .dnav")];
  anim($("#hero"), [{ opacity: 0, transform: "translateY(-18px)" }, { opacity: 1, transform: "none" }], { duration: full ? 480 : 260 });
  if (!full) {
    tiles.concat(rest).forEach((t, i) => anim(t, [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 40 + i * 25 }));
    anim($("#bub"), [{ opacity: 0, transform: "scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 120, easing: EASE.spring });
    return;
  }
  // Ильич вбегает справа с покачиванием шага
  anim(ily, [
    { transform: "translateX(140%) rotate(10deg)", offset: 0 }, { transform: "translateX(60%) translateY(-10px) rotate(-6deg)", offset: .35 },
    { transform: "translateX(18%) translateY(0) rotate(5deg)", offset: .6 }, { transform: "translateX(-4%) translateY(-6px) rotate(-3deg)", offset: .82 },
    { transform: "none", offset: 1 }], { duration: 760, easing: "ease-out" });
  anim($("#bub"), [{ opacity: 0, transform: "scale(.6) translateX(40px)" }, { opacity: 1, transform: "none" }], { duration: 420, delay: 640, easing: EASE.spring });
  const ir = ily?.getBoundingClientRect();
  tiles.forEach((t, i) => {
    const r = t.getBoundingClientRect(), dx = ir ? (ir.left + ir.width / 2 - (r.left + r.width / 2)) * .5 : 0, dy = ir ? (ir.top + ir.height / 2 - (r.top + r.height / 2)) * .5 : 0;
    anim(t, [{ opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(.55) rotate(${i % 2 ? 6 : -6}deg)` }, { opacity: 1, transform: "none" }],
      { duration: 560, delay: 700 + i * 80, easing: EASE.spring });
  });
  rest.forEach((t, i) => anim(t, [{ opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: 900 + tiles.length * 80 + i * 40 }));
  setTimeout(() => haptic("light"), 700);
}

/* смена статуса пары: шапка «перелистывается», Ильич подпрыгивает */
async function phaseTransition() {
  const parts = [...document.querySelectorAll("#hero .h-lbl, #hero .h-count, #hero .h-sub, #hero .h-track")];
  const outs = parts.map((el, i) => anim(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-14px)", filter: "blur(4px)" }], { duration: 200, delay: i * 25 }));
  await Promise.all(outs.map((a) => a?.finished));

    anim(el, [{ opacity: 0, transform: "translateY(16px)", filter: "blur(4px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 420, delay: 40 + i * 50, easing: EASE.soft }));

/* Ильича можно тянуть пальцем: тянется туго и пружинит обратно */
const DRAG_LINES = ["Отпусти! Я при исполнении.", "Э, полегче с вождём.", "Куда тащишь? У меня пара.", "Я тебе не стикер… а, ну да."];
let drag = null, dragged = false;
function rubber(d) { return d * .55 / (1 + Math.abs(d) / 260); }
document.addEventListener("pointerdown", (e) => {
  const il = e.target.closest("#ily"); if (!il || REDUCE) return;
  drag = { il, x: e.clientX, y: e.clientY, moved: false }; dragged = false; il.setPointerCapture?.(e.pointerId);

  if (!drag) return;

  haptic("light");
  if (Math.hypot(e.clientX - x, e.clientY - y) > 110) { setIly(20, DRAG_LINES[Math.floor(Math.random() * DRAG_LINES.length)], "Ильич"); tapUntil = Date.now() + 4000; setTimeout(tickHero, 4100); }
});

/* награды */
function burst(el, colors = ["#DA2227", "#FCCAA7", "#735C56", "#F0F8FA"]) {
  if (REDUCE || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("i"); p.className = "burst"; p.style.background = colors[i % colors.length];
    p.style.left = cx + "px"; p.style.top = cy + "px"; document.body.appendChild(p);
    const a = (i / 12) * Math.PI * 2, d = 40 + Math.random() * 30;
    p.animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.3)`, opacity: 0 }],
      { duration: 560, easing: EASE.out }).finished.then(() => p.remove());
  }
}
function confetti(n = 90) {
  if (REDUCE) return;
  const C = ["#DA2227", "#FCCAA7", "#F0F8FA", "#735C56", "#8E1516", "#D99775"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("i"); c.className = "cf"; c.style.left = Math.random() * 100 + "vw"; c.style.background = C[i % C.length];
    document.body.appendChild(c);
    const x = (Math.random() - .5) * 160, rot = 360 + Math.random() * 720;
    c.animate([{ transform: "translateY(0) rotate(0)", opacity: 1 }, { transform: `translate(${x}px, 105vh) rotate(${rot}deg)`, opacity: .9 }],
      { duration: 1600 + Math.random() * 1600, delay: Math.random() * 300, easing: "cubic-bezier(.25,.6,.4,1)" }).finished.then(() => c.remove());
  }
}
function celebrate(sticker, title, sub) {
  const f = document.createElement("div"); f.className = "fest";
  f.innerHTML = `<img src="${STK(sticker)}" alt=""><b>${esc(title)}</b><span>${esc(sub || "")}</span><small>нажми, чтобы закрыть</small>`;
  document.body.appendChild(f); hnote("success"); confetti();
  anim(f, [{ opacity: 0 }, { opacity: 1 }], { duration: 260 });
  anim(f.querySelector("img"), [{ transform: "scale(.3) rotate(-20deg)", opacity: 0 }, { transform: "scale(1.1) rotate(4deg)", opacity: 1, offset: .65 }, { transform: "none" }], { duration: 700, easing: EASE.out });
  const bob = REDUCE ? null : f.querySelector("img").animate([{ transform: "translateY(0) rotate(-3deg)" }, { transform: "translateY(-14px) rotate(3deg)" }], { duration: 500, direction: "alternate", iterations: Infinity, delay: 700, easing: "ease-in-out" });
  f.onclick = () => { bob?.cancel(); anim(f, [{ opacity: 1 }, { opacity: 0 }], { duration: 220 })?.finished.then(() => f.remove()) ?? f.remove(); };
}
/* пару отменили — праздник один раз на каждую отмену */

/* шторка тянется вниз и закрывается */
let sd = null;
document.addEventListener("touchstart", (e) => { const sh = e.target.closest("#sheet"); if (!sh || !sh.classList.contains("on") || sh.scrollTop > 0) return; sd = { y: e.touches[0].clientY, t: Date.now(), dy: 0 }; }, { passive: true });

/* свайп по дню */
/* день тянется за пальцем: отпустил дальше порога — улетает, приезжает соседний; иначе пружинит на место */
let tx = null, ty = null, txAxis = null;

/* ---------- НЕДЕЛЯ ---------- */
function weekHeadHtml() {
  const ws = S.weekStart, a = pd(ws), b = pd(addDays(ws, 6));
  const t = a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON_GEN[b.getMonth()]}` : `${a.getDate()} ${MON_GEN[a.getMonth()]} – ${b.getDate()} ${MON_GEN[b.getMonth()]}`;
  const rel = ws === monday(S.today) ? "эта неделя" : ws === addDays(monday(S.today), 7) ? "следующая" : ws === addDays(monday(S.today), -7) ? "прошлая" : "";
  return `<div class="wkhead"><button class="iconbtn" data-week="-1" aria-label="Предыдущая неделя">${icon("l")}</button><div class="wkt"><b>${t}</b>${rel ? `<span>${rel}</span>` : ""}</div><button class="iconbtn" data-week="1" aria-label="Следующая неделя">${icon("r")}</button></div>`;
}
async function openWeek(ws, dir = 0) {

  try { await ensureWeek(ws); } catch (e) { return fail(e); }
  if (S.tab === "week" && S.weekStart === ws) renderWeek(dir);
}
function weekSay(days) {
  const busy = days.filter((d) => d.slots.length), n = busy.reduce((a, d) => a + d.slots.length, 0);
  if (!n) return "";
  const top = busy.reduce((a, d) => (d.slots.length > a.slots.length ? d : a));
  const free = days.filter((d) => !d.slots.length && pd(d.date).getDay() !== 0 && pd(d.date).getDay() !== 6);
  const txt = `${n} ${plural(n, "пара", "пары", "пар")} за неделю. ${busy.length > 1 && top.slots.length > 2 ? `Тяжелее всего — ${WD_FULL[pd(top.date).getDay()]}, ${top.slots.length} ${plural(top.slots.length, "пара", "пары", "пар")}.` : ""}${free.length ? ` ${cap(WD_FULL[pd(free[0].date).getDay()])} ${["свободно", "свободен", "свободен", "свободна", "свободен", "свободна", "свободна"][pd(free[0].date).getDay()]}.` : ""}`;
  return `<div class="fhint"><img src="${STK(n > 22 ? 26 : free.length ? 5 : 16)}" alt=""><span>${esc(txt.trim())}</span></div>`;
}
/* контрольная или самостоятельная в этот день: по виду работы из ruz или по пометке #кр из беседы */
const isCtl = (l) => l.tag === "control" || (l.assess || []).length > 0;
const dayCtl = (d) => !!d && d.slots.some((s) => s.lessons.some(isCtl));
function wkPick(days, dir) {
  if (S.wkDay && days.some((d) => d.date === S.wkDay)) return;
  S.wkDay = dir > 0 ? days[0].date : dir < 0 ? days[days.length - 1].date
    : (days.find((d) => d.date === S.today) || days.find((d) => d.slots.length) || days[0]).date;
}
function wkPanel(d) {
  if (!d) return `<div class="skel" style="height:240px"></div>`;
  const n = d.slots.length;
  const head = `<div class="wk-h"><div><b>${d.date === S.today ? "Сегодня" : cap(WD_FULL[pd(d.date).getDay()])}</b><span>${human(d.date)}${n ? ` · ${n} ${plural(n, "пара", "пары", "пар")} · ${d.slots[0].lessons[0].begin}–${d.slots[n - 1].lessons[0].end}` : ""}</span></div>
    ${n ? `<button class="btn sm ghost" data-open="${d.date}">В «Дне»</button>` : ""}</div>`;

}
function renderWeek(dir = 0) {

  if (!days.length) { $("#v-week").innerHTML = weekHeadHtml() + `<div class="skel" style="height:240px"></div>`; return; }
  wkPick(days, dir);
  const chips = days.map((d) => { const dt = pd(d.date), n = d.slots.length, ctl = dayCtl(d), sel = d.date === S.wkDay;
    return `<button class="wchip ${sel ? "sel" : ""} ${d.date === S.today ? "today" : ""} ${n ? "" : "off"} ${ctl ? "ctl" : ""}" data-wsel="${d.date}" aria-pressed="${sel}"
      aria-label="${cap(WD_FULL[dt.getDay()])}, ${human(d.date)}${ctl ? ", есть контрольная" : ""}"><span>${WD[dt.getDay()]}</span><b>${dt.getDate()}</b><i>${ctl ? "КР" : n || "—"}</i></button>`; }).join("");
  $("#v-week").innerHTML = weekHeadHtml() + weekSay(days) + `<div class="wstrip">${chips}</div>`

/* соседний день: свайп; через воскресенье без пар и через границу недели */

let wkTouch = null;

document.addEventListener("touchend", (e) => {
  if (!wkTouch) return; const t = e.changedTouches[0], dx = t.clientX - wkTouch.x, dy = t.clientY - wkTouch.y; wkTouch = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * .6) return; hsel(); wkStep(dx < 0 ? 1 : -1);
}, { passive: true });

  else {
    const mine = all.filter((t) => !ql || t.name.toLowerCase().includes(ql));

    const week = Object.values(S.days).filter((d) => d.date >= S.today).flatMap((d) => d.slots.flatMap((x) => x.lessons));
    const pick = f.type === "person" ? [...new Set(week.map((l) => l.lecturer_full).filter(Boolean))] : [...new Set(week.map((l) => l.auditorium).filter(Boolean))];

async function ensureAhead() {
  const a = addDays(S.today, 1);
  if (S.days[a] && S.days[addDays(a, 6)]) return;
  (await api(`/api/days?start=${a}&end=${addDays(a, 6)}`)).days.forEach((d) => (S.days[d.date] = d));
}
function tripLine() {
  for (let i = 1; i <= 7; i++) {

    q.done = true; if (a.dataset.s === "know" && q.status !== "know") st.known += 1; if (a.dataset.s === "dont" && q.status === "know") st.known -= 1; q.status = a.dataset.s;
    const know = a.dataset.s === "know";
    await anim($(".qcard"), [{ transform: "none", opacity: 1 }, { transform: `translateX(${know ? 120 : -120}%) rotate(${know ? 12 : -12}deg)`, opacity: 0 }], { duration: 300, easing: "ease-in" })?.finished;
    studySheet(st.id);
    anim($(".qcard") || $(".sheet .empty"), [{ transform: "scale(.92) translateY(12px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, easing: EASE.spring });
    if (know && st.known === st.total) { closeSheet(); celebrate(24, "Всё выучено!", `${st.discipline}: ${st.total} из ${st.total}. Теперь только повторять.`); }
    else if (know) hnote("success");
    api("/api/study/mark", { method: "POST", body: { qid: q.id, status: a.dataset.s } }).catch(fail);
    return;
  }
  if (act === "rem-new") { haptic(); S.rem = null; return remSheet(a.dataset.date); }
  if (act === "rem-save") {
    const r = S.rem; r.text = $("#rtext").value.trim(); if (!r.text) return toast("Напиши, что сделать");
    try { await api("/api/reminders", { method: "POST", body: { date: r.date, text: r.text, mode: r.mode, time: r.time, begin: r.begin } }); okHaptic(); toast("Напомню ✍️"); closeSheet(); S.rem = null; invalidate(); openDay(S.date); }
    catch (er) { toast(er.status === 400 ? "Это время уже прошло или пары нет" : "Не получилось"); }
    return;
  }
  if (act === "rem") { haptic(); const d = S.days[a.dataset.date], r = d.reminders.find((x) => x.id === +a.dataset.id);
    return openSheet(`<h4>${esc(r.text)}</h4><div class="muted tiny">${cap(relDay(d.date))}, ${r.at} · ${esc(r.anchor)}</div><button class="btn ghost block" data-act="rem-del" data-id="${r.id}" style="margin-top:16px">Удалить дело</button>`); }
  if (act === "rem-del") { try { await api(`/api/reminders/${a.dataset.id}`, { method: "DELETE" }); toast("Удалил"); closeSheet(); invalidate(); openDay(S.date); } catch (er) { fail(er); } return; }
  if (act === "ann-new") { haptic(); return annSheet(); }
  if (act === "ann-send") {
    const text = $("#atext").value.trim(); if (text.length < 3) return toast("Напиши текст объявления");
    a.disabled = true;
    try { const r = await api("/api/announce", { method: "POST", body: { text } }); closeSheet(); okHaptic(); toast(`Разослал ${r.sent} ${plural(r.sent, "человеку", "людям", "людям")} и в беседу`); S.feed = null; openGroup(); } catch (er) { a.disabled = false; fail(er); }
    return;
  }
  if (act === "ann-read") { haptic(); burst(a); hnote("success"); a.textContent = "✓"; try { await api(`/api/announce/${a.dataset.id}/read`, { method: "POST" }); okHaptic(); const x = S.feed.announcements.find((y) => y.id === +a.dataset.id); if (x) x.read = true; if (S.tab === "group") renderGroup(); else renderDay(); } catch (er) { fail(er); } return; }
  if (act === "ann-remind") { haptic(); try { const r = await api(`/api/announce/${a.dataset.id}/remind`, { method: "POST" }); toast(`Напомню ${r.sent} ${plural(r.sent, "человеку", "людям", "людям")}, когда не на паре`); } catch (er) { fail(er); } return; }
  if (act === "role") { haptic(); try { await api("/api/role/request", { method: "POST" }); toast("Заявку отправил админу"); S.feed.role_pending = true; renderGroup(); } catch (er) { fail(er); } return; }
  if (act === "journal") { haptic(); return journalSheet(); }
  if (act === "roster") { haptic(); return rosterSheet(); }
  if (act === "rsave") { try { await api("/api/roster", { method: "POST", body: { names: $("#rtext").value } }); okHaptic(); toast("Список сохранён"); closeSheet(); } catch (er) { fail(er); } return; }
  if (act === "jsave") {
    const j = S.jr;
    try {
      for (const [i, p] of j.pairs.entries()) await api("/api/journal", { method: "POST", body: { date: j.date, begin: p.begin, discipline: p.discipline, kind: p.kind, marks: j.edit[i] } });
      okHaptic(); toast("Журнал сохранён"); j.pairs.forEach((p, i) => (p.marks = { ...j.edit[i] })); j.edit = null; renderJournal();
    } catch (er) { fail(er); }
    return;
  }
  if (act === "export") { haptic(); try { const r = await api("/api/journal/export", { method: "POST", body: {} }); toast(`Отправил Excel в чат с ботом (${r.pairs} пар)`); } catch (er) { toast(er.status === 404 ? "За этот месяц журнал пуст" : "Не получилось выгрузить"); } return; }
  if (act === "claim") { haptic(); try { await api("/api/roster/claim", { method: "POST", body: { id: +a.dataset.id } }); okHaptic(); closeSheet(); S.abs = undefined; openMe(); } catch (er) { toast(er.status === 409 ? "Этого человека уже кто-то выбрал" : "Не получилось"); } return; }
  if (act === "claim-list") { haptic(); try { const r = await api("/api/roster"); openSheet(`<h4>Кто ты в списке группы?</h4>${r.roster.map((x) => `<button class="jrow" data-act="claim" data-id="${x.id}" ${x.claimed && !x.me ? "disabled" : ""}><span>${esc(x.name)}</span><b>${x.me ? "это я" : x.claimed ? "занято" : ""}</b></button>`).join("") || `<div class="note">Староста ещё не добавил список.</div>`}`); } catch (er) { fail(er); } return; }
  if (act === "cal") {
    haptic();
    try { S.cal = S.cal || (await api("/api/calendar")).links; } catch (er) { return toast("Календарь сейчас недоступен"); }
    const u = S.cal[a.dataset.k] || S.cal.webcal || S.cal.ics; if (!u) return toast("Ссылки нет");
    try { tg?.openLink ? tg.openLink(u) : open(u); } catch (er) { open(u); } return;
  }
  if (act === "place") { hsel(); S.campusOpen = S.campusOpen === a.dataset.id ? null : a.dataset.id; const r = $("#cbody"); if (r) r.innerHTML = campusBody(); return; }
  if (act === "copy") { haptic(); try { await navigator.clipboard.writeText(a.dataset.text); toast("Скопировано"); } catch (er) { toast(a.dataset.text); } return; }
  if (act === "ext") { haptic(); try { tg?.openLink ? tg.openLink(a.dataset.href) : open(a.dataset.href); } catch (er) { open(a.dataset.href); } return; }
  if (act === "addbot") { haptic(); const u = `https://t.me/${BOT_NAME}?startgroup=para`; try { tg?.openTelegramLink ? tg.openTelegramLink(u) : open(u); } catch (er) { open(u); } return; }
  if (act === "tglink") { haptic(); try { tg?.openTelegramLink ? tg.openTelegramLink(a.dataset.href) : open(a.dataset.href); } catch (er) { open(a.dataset.href); } return; }
  if (act === "share") { haptic(); return shareText(a.dataset.text); }
  if (act === "lesson") { haptic(); return lessonSheet(+a.dataset.oid, a.dataset.date); }
  if (act === "par") { haptic(); return parSheet(a.dataset.date, a.dataset.i); }
  if (act === "hide") {
    closeSheet();
    try { await api("/api/hide", { method: "POST", body: { oid: +a.dataset.oid, scope: a.dataset.scope } }); okHaptic(); toast("Скрыто. Вернуть можно во вкладке «Я»"); invalidate(); openDay(S.date); } catch (er) { fail(er); }
    return;
  }
  if (act === "pick") {
    closeSheet();
    try { await api("/api/pick", { method: "POST", body: { oid: +a.dataset.oid } }); okHaptic(); toast("Запомнил подгруппу"); invalidate(); openDay(S.date); } catch (er) { fail(er); }
    return;
  }
  if (act === "teacher") { closeSheet(); S.find = { ...S.find, type: "person", q: a.dataset.name, detail: null }; setTab("find"); runSearchThenOpen(a.dataset.name); return; }
  if (act === "tick") {
    const key = a.dataset.key; let d = {}; try { d = JSON.parse(localStorage.getItem(key) || "{}"); } catch (er) {}
    d[a.dataset.id] = !d[a.dataset.id]; try { localStorage.setItem(key, JSON.stringify(d)); } catch (er) {}
    haptic(); return renderDay();
  }
  if (act === "delitem") { try { await api(`/api/checklist/${a.dataset.id}`, { method: "DELETE" }); haptic(); S.checklist = null; S.home = null; await ensureChecklist(); renderMe(); } catch (er) { fail(er); } return; }
  if (act === "fopen") { haptic(); return openFind(a.dataset.id, a.dataset.label); }
  if (act === "fquick") { haptic(); return quickFind(a.dataset.q, a.dataset.label); }
  if (act === "fback") return goBack();
  if (act === "chgroup") return groupSheet();
  if (act === "mesec") { haptic(); return meSec(a.dataset.sec); }
  if (act === "stbar") { hsel(); document.querySelectorAll(".stbar.on").forEach((x) => x.classList.remove("on")); a.classList.add("on"); $("#sttip").textContent = a.dataset.tip; return; }
  if (act === "stats-reload") { haptic(); S.stats = undefined; return meSec("stats"); }
  if (act === "unhide") { try { await api(`/api/hidden/${a.dataset.id}`, { method: "DELETE" }); toast("Вернул"); invalidate(); S.hidden = (await api("/api/hidden")).rules; await ensureChecklist(); renderMe(); } catch (er) { fail(er); } return; }
  if (act === "loc") return requestLocation();
  if (act === "loc-reset") { S.me.location = false; queueSave({ location: null }); renderMe(); return; }
  const ft = t.closest("[data-ftype]"); if (ft) { S.find.type = ft.dataset.ftype; S.find.items = []; renderFind(); if (ft.dataset.ftype !== "free") runSearch(); return; }
  const fb = t.closest("[data-fb]"); if (fb) { haptic(); S.free.building = { id: fb.dataset.fb }; return loadFree({ building: fb.dataset.fb }); }
  const fp = t.closest("[data-fp]"); if (fp) { haptic(); S.free.begin = fp.dataset.fp; return loadFree({ begin: fp.dataset.fp }); }
  if (t.closest("[data-goto-free]")) { haptic(); S.find.type = "free"; S.find.detail = null; return setTab("find"); }
  const ad = t.closest("[data-auddate]"); if (ad) { S.find.audDate = ad.dataset.auddate; return openFind(S.find.detail.id, S.find.detail.label); }
  const ch = t.closest("[data-chip]");
  if (ch) {
    const k = ch.dataset.chip, v = /^\d+$/.test(ch.dataset.v) ? +ch.dataset.v : ch.dataset.v; hsel();
    ch.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === ch));
    if (k.startsWith("t")) { const b = S.me.buildings.find((x) => "t" + x.oid === k); if (b) { b.minutes = v; b.set = true; } } else S.me[k] = v;
    queueSave({ [k]: v }); renderMe(); return;
  }
  const st = t.closest("[data-step]");
  if (st) {
    const k = st.dataset.step, out = $("#o-" + k), cur = parseInt(out.textContent, 10);
    const v = Math.max(+st.dataset.min, Math.min(+st.dataset.max, cur + +st.dataset.d));
    out.textContent = v + " мин"; haptic(); queueSave({ [k]: v });
    if (k.startsWith("t")) { const b = S.me.buildings.find((x) => "t" + x.oid === k); if (b) { b.minutes = v; b.set = true; } } else S.me[k] = v;
    return;
  }
  const ts = t.closest("[data-tstep]");
  if (ts) {
    const k = ts.dataset.tstep, out = $("#t-" + k);
    const v = hhmm((tMin(out.textContent) + +ts.dataset.d + 1440) % 1440);
    out.textContent = v; S.me[k] = v; haptic(); queueSave({ [k]: v }); return;
  }
  const s = t.closest("[data-sw]");
  if (s) {
    const k = s.dataset.sw, on = !s.classList.contains("on"); haptic();
    if (k === "pre_end_toggle") { S.me.pre_end_on = on; queueSave({ pre_end: on ? S.me.pre_end || 15 : null }); }
    else if (k === "evening_toggle") { S.me.evening = on ? "21:00" : null; queueSave({ evening: S.me.evening }); }
    else if (k === "nolessons_toggle") { S.me.nolessons = on ? "09:00" : null; queueSave({ nolessons: S.me.nolessons }); }
    else if (k === "raw") { try { localStorage.setItem("raw", on ? "1" : "0"); } catch (er) {} }
    else { S.me[k] = on; queueSave({ [k]: on }); }
    renderMe(); return;
  }
});
document.addEventListener("change", (e) => {
  const tm = e.target.closest("[data-time]");
  if (tm && tm.value) { S.me[tm.dataset.time] = tm.value; queueSave({ [tm.dataset.time]: tm.value }); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "fq") { S.find.q = e.target.value.trim(); if (S.find.type === "person" && $("#fres")) $("#fres").innerHTML = findResults(); runSearch(); }
  if (e.target.id === "cq") { S.campusQ = e.target.value.trim(); const r = $("#cbody"); if (r) r.innerHTML = campusBody(); }
  if (e.target.id === "gq") searchGroups(e.target.value.trim(), $("#gres"), async (id, label) => {
    closeSheet(); toast("Загружаю расписание…");
    try { S.me = (await api("/api/group", { method: "POST", body: { id, label } })).me; invalidate(); updateHeader(); openMe(); okHaptic(); toast(`Группа ${label}`); }
    catch (er) { fail(er); }
  });
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form='item']"); if (!f) return;
  e.preventDefault();
  const text = f.querySelector("input").value.trim(); if (!text) return;
  const disc = S.checklist[+f.dataset.idx].name;
  try {
    for (const part of text.split(/[,;\n]/).map((x) => x.trim()).filter(Boolean)) await api("/api/checklist", { method: "POST", body: { discipline: disc, text: part } });
    okHaptic(); S.checklist = null; S.home = null; await ensureChecklist(); renderMe();
  } catch (er) { fail(er); }
});
async function quickFind(q, label) {
  const f = S.find;
  try {
    const items = (await api(`/api/search?type=${f.type}&q=${encodeURIComponent(f.type === "person" ? q.split(" ")[0] : q)}`)).items;
    const hit = items.find((x) => x.label === label || x.label === q) || items[0];
    if (hit) openFind(hit.id, hit.label); else { f.q = q; f.items = items; renderFind(); }
  } catch (e) { fail(e); }
}
async function runSearchThenOpen(name) {
  try {
    const items = (await api(`/api/search?type=person&q=${encodeURIComponent(name.split(" ")[0])}`)).items;
    const hit = items.find((x) => x.label === name) || items[0];
    if (hit) openFind(hit.id, hit.label); else { S.find.items = items; renderFind(); }
  } catch (e) { fail(e); }
}

/* ---------- старт ---------- */
function start() {
  updateHeader();
  const sp = tg?.initDataUnsafe?.start_param || "";
  const d = qs.get("d") || (sp.startsWith("d") ? sp.slice(1).replace(/_/g, "-") : null);
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.date = d;
  const tab = qs.get("tab");
  if (["person", "auditorium", "free", "campus"].includes(qs.get("ftype"))) S.find.type = qs.get("ftype");
  setTab({ home: "day", sched: "day", things: "me", set: "me" }[tab] || (["day", "week", "group", "find", "me"].includes(tab) ? tab : "day"));
  setInterval(() => { if (!$("#sheet").classList.contains("on")) { if (S.tab === "day" && S.days[S.date] && S.date !== S.today) renderDay(); if (S.tab === "week" && S.days[S.weekStart]) renderWeek(); } }, 60000);
  setInterval(tickHero, 15000);
}
(async function boot() {
  applyTheme();
  try { tg?.ready(); tg?.expand(); tg?.disableVerticalSwipes?.(); tg?.onEvent?.("themeChanged", applyTheme); tg?.BackButton?.onClick(goBack); } catch (e) {}
  const fatal = (title, text, retry = false) => { bootDone(); $("main").innerHTML = `<div class="empty"><img class="stk" src="static/stickers/11.webp" alt=""><div class="big">${title}</div><p>${text}</p>${retry ? `<button class="btn" onclick="location.reload()" style="margin-top:18px">ещё раз</button>` : ""}</div>`; $(".tabbar").classList.add("hide"); };
  if (!tg?.initData && !DEV_USER) return fatal("Открой через меню", "Нажми кнопку «Приложение» слева от поля ввода в чате с ботом — так Telegram передаёт, кто ты.");
  try { const b = await api("/api/bootstrap"); S.me = b.me; S.today = b.today; clockOffset = Date.parse(b.now) - Date.now(); }
  catch (e) { return fatal("Нет связи", e.status === 401 ? "Сессия устарела. Закрой приложение и открой его заново." : "Не удалось подключиться. Проверь интернет.", e.status !== 401); }
  if (!S.me.onboarded || !S.me.group) { $("#onb").classList.add("on"); return onbIntro(); }
  start();
})();
</script>
</body>
